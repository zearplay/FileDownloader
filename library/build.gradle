plugins {
    id 'com.android.library'
    id 'maven-publish'
}

plugins.apply('checkstyle')

android {
    namespace 'com.liulishuo.filedownloader'

    buildFeatures {
        aidl true
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

task('checkstyle', type: Checkstyle) {
    configFile rootProject.file('checkstyle.xml')
    source 'src/main/java'
    source 'src/test/java'
    ignoreFailures false
    showViolations true
    include '**/*.java'

    classpath = files()
}

checkstyle {
    toolVersion = '10.17.0'
}

afterEvaluate {
    tasks.findByName('check').dependsOn('checkstyle')

    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = GROUP
                artifactId = 'FileDownloader'
                version = VERSION_NAME

                pom {
                    name = 'FileDownloader'
                    description = 'Android file download library with ANR and crash hardening.'
                    url = 'https://github.com/zearplay/FileDownloader'
                    licenses {
                        license {
                            name = 'The Apache Software License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            distribution = 'repo'
                        }
                    }
                    developers {
                        developer {
                            id = 'zearplay'
                            name = 'zearplay'
                            url = 'https://github.com/zearplay'
                        }
                    }
                    scm {
                        url = 'https://github.com/zearplay/FileDownloader'
                        connection = 'scm:git:https://github.com/zearplay/FileDownloader.git'
                        developerConnection = 'scm:git:ssh://git@github.com/zearplay/FileDownloader.git'
                    }
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.11.1'
    testImplementation 'org.mockito:mockito-core:2.28.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
